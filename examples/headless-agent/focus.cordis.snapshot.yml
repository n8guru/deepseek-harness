# Keyless Focus scenario: neither credentials nor user settings are loaded.
- id: cli-mock-llm
  name: './tests/fixtures/cli-mock-llm.ts'
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: settings
        disabled: true
      - id: credentials
        disabled: true
      - id: llm-deepseek
        disabled: true
      - id: agent-spine
        config:
          agents:
            - id: main
              sessionId: focus-main
              provider: cli-mock
              model: cli-mock
          workspaceContext: false
          dshHome: !!js "process.cwd() + '/.focus-home'"
          skills:
            filesystem:
              agentsHome: !!js "process.cwd() + '/.focus-home'"
          persona: 'One bounded action, checkpoint, explicit Check, then foreground. Worker completion is not a Nate-test pass.'
      - id: persistence
        config:
          root: !!js "process.cwd() + '/.focus-home'"
          compression: none
